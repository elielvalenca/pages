<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Página não encontrada | eliel.page</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0b0c10;
      --fg: #f3f4f6;
      --muted: #9ca3af;
      --border: #1f2937;
      --accent: #e5e7eb;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fafafa;
        --fg: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #111827;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      padding: 2rem;
      line-height: 1.5;
    }

    main {
      max-width: 28rem;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.25rem;
    }

    .code {
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
    }

    a {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
      transition: opacity 0.15s ease;
    }

    a:hover {
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <main>
    <div class="code">ERRO 404</div>
    <h1>Página não encontrada</h1>
    <p>O link acessado não existe, expirou ou foi desativado.</p>
    <a href="https://elielvalenca.com">Ir para elielvalenca.com →</a>
  </main>
</body>
</html>
