name: CI/CD & Deploy

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-secrets:
    name: Check Secrets
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - name: Verify Cloudflare Secrets Availability
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare secrets are not configured in this repository. Skipping pipeline."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test & Build
    needs: check-secrets
    if: needs.check-secrets.outputs.has_secrets == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare wrangler.jsonc
        run: |
          if [ ! -f wrangler.jsonc ]; then
            cp wrangler.jsonc.example wrangler.jsonc
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests (Unit & Integration)
        run: npm test

      - name: Validate Worker bundle & assets (Dry Run)
        run: npx wrangler deploy --dry-run

  deploy:
    name: Deploy to Cloudflare
    needs: [check-secrets, test]
    if: needs.check-secrets.outputs.has_secrets == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare wrangler.jsonc
        run: |
          if [ ! -f wrangler.jsonc ]; then
            cp wrangler.jsonc.example wrangler.jsonc
          fi

      - name: Configure D1 Database ID
        if: env.D1_DATABASE_ID != ''
        run: |
          sed -i 's/"database_id": "00000000-0000-0000-0000-000000000000"/"database_id": "'"$D1_DATABASE_ID"'"/' wrangler.jsonc
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Apply D1 Migrations (Remote)
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and Static Assets
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
